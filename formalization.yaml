        hardware: "cloud container"
      prompting_notes: "n/a"
  spend_usd: "not tracked"

fidelity:
  divergences: >-
    (1) Plane graphs are combinatorial maps whose graph and dual are connected
    and which satisfy Euler's formula, not drawings; that these are exactly the
    plane embeddings is classical and not formalized. (2) The feasibility test
    runs Bellman-Ford over the dual, O(n^2) steps, not the near-linear
    algorithms of the literature. (3) The machine statements are about one
    explicit machine (unit cost per instruction, natural words bounded by W
    along the run), word programs (WordRAM.Program.IsWord: no real instruction,
    checked by the kernel on the compiled code; for the maximum flow, on each
    subroutine program and on the assembly) and fixed input encodings; the
    programs are existentially quantified. (4) Capacities and lengths are
    integers (natural numbers in the encodings). (5) In the maximum-flow
    statement the constants c and k are existentially quantified, the word bound
    must be at least c (7 s)^k where s includes the total capacity, and the
    encoding must list the darts so that the rotation and the face walk are
    transitive on the darts of each vertex and of each face. The output is a
    list p ++ Z :: q with |p| = n and p[x] < |q| for every dart x < n; the flow
    on dart x is q[p[x]] - Z (written q.getD (p.getD x 0) 0 - Z in Lean, with
    both lookups in range by the statement).

review:
  status: "unreviewed"
  reviewers: []
  notes: >-
    No claims beyond the verification report for the submitted commit. The
    proofs have not been reviewed by a person.

alignment:
  namespace: "PlanarFlow"
  statements:
    - source: "Ford-Fulkerson 1956: the max-flow min-cut theorem (multiple sources and sinks)"
      lean: "PlanarFlow.maxflow_mincut"
      module: "PlanarFlowSolution"
      status: proved
    - source: "Miller-Naor 1995: feasible flows with supplies and demands in plane graphs via dual potentials"
      lean: "PlanarFlow.miller_naor"
      module: "PlanarFlowSolution"
      status: proved
    - source: "Feasible flows in plane graphs on the machine, O(n^2) steps"
      lean: "PlanarFlow.feasible_flow_machine"
      module: "PlanarFlowSolution"
      status: proved
    - source: "Dijkstra 1959: single-source distances on the machine, O((n + m) log n) steps"
      lean: "PlanarFlow.dijkstra_machine"
      module: "PlanarFlowSolution"
      status: proved
    - source: "Maximum bipartite matching by augmenting paths (Berge 1957) with Kőnig's certificate (Kőnig 1931) on the machine, O(n (n + m)) steps"
      lean: "PlanarFlow.bipartite_matching_machine"
      module: "PlanarFlowSolution"
      status: proved
    - source: "Borradaile-Klein-Mozes-Nussbaum-Wulff-Nilsen 2017: multiple-source multiple-sink maximum flow in plane graphs on the machine, O(n log^3 n) steps"
      lean: "PlanarFlow.maxflow_machine"
      module: "PlanarFlowSolution"
      status: proved

